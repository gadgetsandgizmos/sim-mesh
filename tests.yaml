tests:
  - id: testbed
    type: host
    env: sim-mesh
    tier: smoke
    run: cd testbed && python3 -m pytest -q
    tools: [docker]
    paths: [testbed/**, sim, Dockerfile, Dockerfile.dev, tests.yaml]

  - id: ether
    type: host
    env: sim-mesh
    tier: smoke
    run: cd ether && python3 -m pytest -q
    tools: [docker]
    paths: [ether/**, sim, Dockerfile, Dockerfile.dev, tests.yaml]

  - id: radio
    type: host
    env: sim-mesh
    tier: smoke
    run: cd radio && python3 -m pytest -q tests
    tools: [docker]
    paths: [radio/**, sim, Dockerfile, Dockerfile.dev, tests.yaml]

  - id: planner
    type: host
    env: sim-mesh
    tier: smoke
    run: cd planner && cargo test
    tools: [docker]
    paths: [planner/**, sim, Dockerfile, Dockerfile.dev, tests.yaml]

  - id: planner-slow
    type: host
    env: sim-mesh
    tier: extended
    run: cd planner && cargo test -- --ignored
    tools: [docker]
    paths: [planner/**, sim, Dockerfile, Dockerfile.dev, tests.yaml]
